<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico & Neo Bingo</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:20px;text-align:center;color:#222}button,select,input{font:inherit}button{border:0;border-radius:6px;background:#0878df;color:white;padding:9px 13px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){filter:brightness(.9)}#controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}#title{font-size:23px;font-weight:700}#settings,#musicSettings,#normalSettings,#paperSettings,#adultSettingsTop{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}#musicSettings{background:white;border:1px solid #ddd;border-radius:10px;padding:12px;margin:0 auto 15px;max-width:1200px}#musicVolume{width:130px}#statusBar{font-size:19px;font-weight:bold;margin:12px}#currentArea{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:15px}#current{display:flex;gap:12px;align-items:center;min-height:95px}#current-letter{font-size:80px;color:red;font-weight:700}#current-number{font-size:54px;font-weight:700}#remainingCount{font-weight:bold}#winnerTop{font-size:24px;color:#c32d2d;font-weight:bold;max-width:1000px}#currentButtons{display:flex;gap:10px}#continueBtn{background:#249844}#actionBtn{background:#e18b00}.hidden{display:none!important}.panel{background:white;border:1px solid #ddd;border-radius:10px;padding:14px;margin:0 auto 15px;max-width:1200px;text-align:left}.panel h3{margin:0 0 12px}#adultPlayersConfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.adult-player-config{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#f5f5f5;padding:9px;border-radius:7px}#adultPots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.pot-box{padding:13px;border-radius:8px;color:white;font-weight:bold}.pot-box small{display:block;margin-top:5px;font-weight:normal}.pot1{background:#398db0}.pot2{background:#329754}.pot3{background:#c84c4c}#cards{max-width:1300px;margin:0 auto 16px}.flat-card-wrap{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.adult-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.adult-player-column{background:white;border:2px solid #ddd;border-radius:10px;padding:10px}.adult-player-title{font-weight:bold;margin-bottom:9px}.adult-player-cards{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.bingo-card{background:white;border:2px solid #0878df;border-radius:7px;padding:5px}.bingo-card.winner-card{background:#ff5757;border-color:#b60000;box-shadow:0 0 13px #d44a4a66}.card-title{font-weight:bold;font-size:14px;margin-bottom:5px}.bingo-card table{border-collapse:collapse}.bingo-card th,.bingo-card td{border:1px solid #bbb;width:28px;height:28px;font-size:12px;text-align:center;padding:1px}.bingo-card th{background:#0878df;color:white}.bingo-card td.marked{background:#ffe95a}.bingo-card td.completed{background:#00e83c;font-weight:bold}#history{max-width:1200px;margin:15px auto;line-height:1.8;font-size:17px;overflow-wrap:anywhere}.stats-table{width:100%;border-collapse:collapse}.stats-table th,.stats-table td{border:1px solid #ddd;text-align:center;padding:7px;font-size:13px}.stats-table th{background:#f0f0f0}.table-scroll{overflow-x:auto}@media(max-width:650px){body{padding:10px}#current-letter{font-size:56px}#current-number{font-size:40px}#winnerTop{font-size:20px}.bingo-card th,.bingo-card td{width:24px;height:24px;font-size:11px}}
</style>
</head>
<body>
<div id="controls"><div id="title">Nico & Neo Bingo</div><div id="settings"><label for="gameMode">Läge:</label><select id="gameMode"><option value="standard">Standard Bingo</option><option value="three-level">Bingo 3 nivåer</option><option value="adult">Bingo 3 nivå VUXEN</option><option value="paper">Pappersbingo</option></select><div id="normalSettings"><label for="playerCount">Brickor:</label><select id="playerCount"></select></div><div id="adultSettingsTop" class="hidden"><label><input id="moneyEnabled" type="checkbox"> Spela med pengar</label></div><div id="paperSettings" class="hidden"><label for="paperSpeed">Tid mellan nummer:</label><select id="paperSpeed"><option value="3000">3 sek</option><option value="5000" selected>5 sek</option><option value="7000">7 sek</option><option value="10000">10 sek</option><option value="15000">15 sek</option><option value="20000">20 sek</option><option value="30000">30 sek</option></select></div></div><button id="startBtn">Starta</button><button id="bingoBtn">BINGO</button><button id="toggleSpeakBtn">Tal: Av</button><button id="resetBtn">Återställ</button></div>
<div id="musicSettings"><label for="musicTrack">🎵 Musik:</label><select id="musicTrack"><option value="off">Musik av</option><option value="background.mp3">Original – background</option><option value="background1.mp3">Background 1</option><option value="background2.mp3">Background 2</option><option value="background3.mp3">Background 3</option><option value="halloween.mp3">Halloween</option><option value="jazz.mp3">Jazz</option><option value="jazz1.mp3">Jazz 1</option><option value="jazz2.mp3">Jazz 2</option></select><label for="musicMode">När låten slutar:</label><select id="musicMode"><option value="repeat">Upprepa samma låt</option><option value="next">Spela nästa låt</option></select><label for="musicVolume">Volym:</label><input id="musicVolume" type="range" min="0" max="100" value="30"><span id="volumeLabel">30 %</span></div>
<div id="statusBar"></div><div id="currentArea"><div id="current"><div id="current-letter">-</div><div id="current-number"></div></div><div id="remainingCount"></div><div id="winnerTop"></div><div id="currentButtons"><button id="continueBtn" class="hidden">Fortsätt</button><button id="actionBtn" class="hidden">Starta nytt spel</button></div></div>
<div id="adultConfigWrap" class="panel hidden"><h3>Vuxenläge – välj brickor per spelare</h3><div id="adultPlayersConfig"></div></div><div id="adultPotsWrap" class="panel hidden"><h3>Pottar</h3><div id="adultPots"></div></div><div id="cards"></div><div id="adultStatsWrap" class="panel hidden"><h3>Statistik</h3><div id="adultStats" class="table-scroll"></div></div><div id="history"></div>
<audio id="bgm" preload="auto"></audio><audio id="ding" src="audio/ding.mp3"></audio><audio id="bingoSound" src="audio/bingo.mp3"></audio>
<script>
const $=id=>document.getElementById(id);
const allNumbers=Array.from({length:75},(_,i)=>i+1);
const ranges={B:[1,15],I:[16,30],N:[31,45],G:[46,60],O:[61,75]};
const tracks=['background.mp3','background1.mp3','background2.mp3','background3.mp3','halloween.mp3','jazz.mp3','jazz1.mp3','jazz2.mp3'];
let remaining=[],drawn=[],intervalId=null,speakEnabled=false,currentLevel=1,waitingForContinue=false,gameFinished=false,adultHiddenRemoved=[],adultRoundEnded=false,adultRoundPrepared=false,adultRoundPaid={1:false,2:false,3:false};
const adultSession={round:1,moneyEnabled:false,pots:{1:0,2:0,3:0},stats:Array.from({length:10},()=>({bought:0,spent:0,wins1:0,wins2:0,wins3:0,won:0}))};
const isAdultMode=()=>$('gameMode').value==='adult';const isPaperMode=()=>$('gameMode').value==='paper';
const getLetter=n=>n<=15?'B':n<=30?'I':n<=45?'N':n<=60?'G':'O';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function saveMusic(){try{localStorage.setItem('nicoNeoMusic',JSON.stringify({track:$('musicTrack').value,mode:$('musicMode').value,volume:Number($('musicVolume').value)}));}catch(e){}}
function loadMusic(){try{const s=JSON.parse(localStorage.getItem('nicoNeoMusic')||'null');if(!s)return;if(s.track==='off'||tracks.includes(s.track))$('musicTrack').value=s.track;if(['repeat','next'].includes(s.mode))$('musicMode').value=s.mode;if(Number.isFinite(s.volume))$('musicVolume').value=Math.max(0,Math.min(100,s.volume));}catch(e){}}
function musicPlay(){const bgm=$('bgm'),track=$('musicTrack').value;if(track==='off'){bgm.pause();return;}const src='audio/'+track;if(bgm.getAttribute('src')!==src){bgm.src=src;bgm.load();}bgm.volume=Number($('musicVolume').value)/100;bgm.play().catch(()=>{});}
function musicChange(){saveMusic();musicPlay();}
$('bgm').addEventListener('ended',()=>{if($('musicTrack').value==='off')return;if($('musicMode').value==='next'){const idx=tracks.indexOf($('musicTrack').value);$('musicTrack').value=tracks[(idx+1)%tracks.length];saveMusic();}musicPlay();});
$('musicTrack').addEventListener('change',musicChange);$('musicMode').addEventListener('change',saveMusic);$('musicVolume').addEventListener('input',()=>{$('volumeLabel').textContent=$('musicVolume').value+' %';$('bgm').volume=Number($('musicVolume').value)/100;saveMusic();});
function createAdultPlayerConfig(){$('adultPlayersConfig').innerHTML='';for(let i=1;i<=10;i++){const row=document.createElement('div');row.className='adult-player-config';const label=document.createElement('label');label.textContent='SPELARE '+i;const sel=document.createElement('select');for(let n=0;n<=5;n++){const op=document.createElement('option');op.value=n;op.textContent=n+' brickor';if(i<=2&&n===1)op.selected=true;sel.appendChild(op);}sel.addEventListener('change',()=>{if(!adultRoundPrepared&&!drawn.length&&!waitingForContinue)renderAdultCardsPreview();});row.append(label,sel);$('adultPlayersConfig').appendChild(row);}}
function getAdultSelections(){return [...$('adultPlayersConfig').querySelectorAll('select')].map(s=>Number(s.value));}
function buildCardData(rowCount){const cols={};for(const [letter,[start,end]]of Object.entries(ranges)){cols[letter]=shuffle(Array.from({length:end-start+1},(_,i)=>start+i)).slice(0,rowCount);}return Array.from({length:rowCount},(_,r)=>[cols.B[r],cols.I[r],cols.N[r],cols.G[r],cols.O[r]]);}
function createCardElement({title,rows,playerIndex=null,playerCardIndex=null,flatIndex=null}){const card=document.createElement('div');card.className='bingo-card';if(playerIndex!==null)card.dataset.playerIndex=playerIndex;if(playerCardIndex!==null)card.dataset.playerCardIndex=playerCardIndex;if(flatIndex!==null)card.dataset.flatIndex=flatIndex;const label=document.createElement('div');label.className='card-title';label.textContent=title;card.appendChild(label);const table=document.createElement('table');const head=document.createElement('tr');for(const l of 'BINGO'){const th=document.createElement('th');th.textContent=l;head.appendChild(th);}table.appendChild(head);for(const row of rows){const tr=document.createElement('tr');for(const num of row){const td=document.createElement('td');td.textContent=num;tr.appendChild(td);}table.appendChild(tr);}card.appendChild(table);return card;}
function renderNormalCards(count){$('cards').innerHTML='';const wrap=document.createElement('div');wrap.className='flat-card-wrap';for(let i=0;i<count;i++)wrap.appendChild(createCardElement({title:'Bricka '+(i+1),rows:buildCardData(15),flatIndex:i}));$('cards').appendChild(wrap);}
function renderAdultCardsPreview(){$('cards').innerHTML='';if(!isAdultMode())return;const board=document.createElement('div');board.className='adult-board';getAdultSelections().forEach((count,p)=>{if(!count)return;const col=document.createElement('div');col.className='adult-player-column';const title=document.createElement('div');title.className='adult-player-title';title.textContent='SPELARE '+(p+1);col.appendChild(title);const holder=document.createElement('div');holder.className='adult-player-cards';for(let i=0;i<count;i++)holder.appendChild(createCardElement({title:'Bricka '+(i+1),rows:buildCardData(3),playerIndex:p,playerCardIndex:i}));col.appendChild(holder);board.appendChild(col);});$('cards').appendChild(board);}
function stopGame(){if(intervalId!==null){clearInterval(intervalId);intervalId=null;}}
function clearWinnerCards(){$('cards').querySelectorAll('.winner-card').forEach(c=>c.classList.remove('winner-card'));}
function markCards(num){$('cards').querySelectorAll('td').forEach(td=>{if(Number(td.textContent)===num)td.classList.add('marked');});}
function updateCompletedRowHighlights(){$('cards').querySelectorAll('.bingo-card').forEach(card=>{[...card.querySelectorAll('tr')].slice(1).forEach(row=>{const cells=[...row.querySelectorAll('td')];const full=cells.length>0&&cells.every(c=>c.classList.contains('marked'));cells.forEach(c=>c.classList.toggle('completed',full));});});}
function getCompletedRowsForCard(card){return [...card.querySelectorAll('tr')].slice(1).filter(row=>{const cells=[...row.querySelectorAll('td')];return cells.length>0&&cells.every(c=>c.classList.contains('marked'));}).length;}
function getWinnersForLevel(level){return [...$('cards').querySelectorAll('.bingo-card')].filter(c=>getCompletedRowsForCard(c)>=level).map(card=>({cardEl:card,playerIndex:card.dataset.playerIndex===undefined?null:Number(card.dataset.playerIndex),playerCardIndex:card.dataset.playerCardIndex===undefined?null:Number(card.dataset.playerCardIndex),flatIndex:card.dataset.flatIndex===undefined?null:Number(card.dataset.flatIndex)}));}
function formatWinnerNames(winners){return winners.map(w=>isAdultMode()?`Spelare ${w.playerIndex+1} – Bricka ${w.playerCardIndex+1}`:`Bricka ${w.flatIndex+1}`).join(', ');}
function markWinnerCards(winners){clearWinnerCards();winners.forEach(w=>w.cardEl.classList.add('winner-card'));}
function playDrawSound(letter,num){if(!speakEnabled){$('ding').currentTime=0;$('ding').play().catch(()=>{});return;}const letterAudio=new Audio('audio/'+letter+'.mp3');letterAudio.onended=()=>{new Audio('audio/'+num+'.mp3').play().catch(()=>{});};letterAudio.play().catch(()=>{});}
function updateHistory(){$('history').textContent=drawn.length?'Dragna nummer: '+drawn.map(n=>getLetter(n)+n).join(' - '):'';}
function updateRemainingCount(){$('remainingCount').textContent=(isAdultMode()||isPaperMode())&&remaining.length||((isAdultMode()||isPaperMode())&&drawn.length)?'Kvar att dra: '+remaining.length:'';}
function renderAdultPots(){$('adultPots').innerHTML='';for(let level=1;level<=3;level++){const div=document.createElement('div');div.className='pot-box pot'+level;div.textContent=`Pot ${level}: ${adultSession.moneyEnabled?adultSession.pots[level]+' kr':'Avstängt'}`;const small=document.createElement('small');small.textContent=adultRoundPaid[level]?'Utbetald denna runda':'Öppen denna runda';div.appendChild(small);$('adultPots').appendChild(div);}}
function renderAdultStats(){const table=document.createElement('table');table.className='stats-table';const tr=document.createElement('tr');for(const h of ['Spelare','Köpta brickor','Satsat','Pot 1 vinster','Pot 2 vinster','Pot 3 vinster','Vunnit']){const th=document.createElement('th');th.textContent=h;tr.appendChild(th);}table.appendChild(tr);adultSession.stats.forEach((s,i)=>{const row=document.createElement('tr');for(const value of [`Spelare ${i+1}`,s.bought,s.spent+' kr',s.wins1,s.wins2,s.wins3,s.won+' kr']){const td=document.createElement('td');td.textContent=value;row.appendChild(td);}table.appendChild(row);});$('adultStats').replaceChildren(table);}
function distributeRoundMoney(total){if(!adultSession.moneyEnabled||total<=0)return;const p1=Math.floor(total*.2),p2=Math.floor(total*.3);adultSession.pots[1]+=p1;adultSession.pots[2]+=p2;adultSession.pots[3]+=total-p1-p2;}
function resetAdultSession(){adultSession.round=1;adultSession.moneyEnabled=$('moneyEnabled').checked;adultSession.pots={1:0,2:0,3:0};adultSession.stats=Array.from({length:10},()=>({bought:0,spent:0,wins1:0,wins2:0,wins3:0,won:0}));adultRoundPaid={1:false,2:false,3:false};adultHiddenRemoved=[];adultRoundEnded=false;adultRoundPrepared=false;renderAdultPots();renderAdultStats();}
function prepareAdultRound(){const selections=getAdultSelections(),totalCards=selections.reduce((a,b)=>a+b,0);if(!totalCards){$('winnerTop').textContent='Välj minst en bricka.';return false;}stopGame();drawn=[];adultRoundPaid={1:false,2:false,3:false};adultRoundEnded=false;waitingForContinue=false;gameFinished=false;$('current-letter').textContent='-';$('current-number').textContent='';$('winnerTop').textContent='';$('continueBtn').classList.add('hidden');$('actionBtn').classList.add('hidden');adultSession.moneyEnabled=$('moneyEnabled').checked;selections.forEach((count,p)=>{adultSession.stats[p].bought+=count;if(adultSession.moneyEnabled)adultSession.stats[p].spent+=count*2;});distributeRoundMoney(totalCards*2);adultHiddenRemoved=shuffle([...allNumbers]).slice(0,15);remaining=shuffle(allNumbers.filter(n=>!adultHiddenRemoved.includes(n)));renderAdultCardsPreview();renderAdultPots();renderAdultStats();updateRemainingCount();updateHistory();adultRoundPrepared=true;updateStatus();return true;}
function nextAdultLevel(){return !adultRoundPaid[1]?1:!adultRoundPaid[2]?2:!adultRoundPaid[3]?3:null;}
function handleAdultWin(level,winners){stopGame();waitingForContinue=level<3;adultRoundPaid[level]=true;markWinnerCards(winners);updateCompletedRowHighlights();let payoutText='';if(adultSession.moneyEnabled){const pot=adultSession.pots[level],share=Math.floor(pot/winners.length),remainder=pot-share*winners.length;const payouts={};winners.forEach(w=>{const p=w.playerIndex;adultSession.stats[p].won+=share;adultSession.stats[p]['wins'+level]++;payouts[p]=(payouts[p]||0)+share;});adultSession.pots[level]=0;adultSession.pots[Math.min(3,level+1)]+=remainder;payoutText=' '+Object.entries(payouts).map(([p,sum])=>`Spelare ${Number(p)+1}: ${sum} kr`).join(', ')+(remainder?`. ${remainder} kr flyttas ${level===3?'inte från Pot 3':'till Pot '+(level+1)}.`:'');}else{winners.forEach(w=>adultSession.stats[w.playerIndex]['wins'+level]++);}renderAdultPots();renderAdultStats();$('winnerTop').textContent='BINGO! '+formatWinnerNames(winners)+'.'+payoutText;$('bingoSound').currentTime=0;$('bingoSound').play().catch(()=>{});if(level===3){gameFinished=true;waitingForContinue=false;$('continueBtn').classList.add('hidden');showAction('new-game','Starta nytt spel');}else{$('continueBtn').classList.remove('hidden');$('actionBtn').classList.add('hidden');}updateStatus();}
function checkAdultWin(){const level=nextAdultLevel();if(level===null)return false;const winners=getWinnersForLevel(level);if(!winners.length)return false;handleAdultWin(level,winners);return true;}
function evaluateNormalWin(){const level=$('gameMode').value==='standard'?1:currentLevel;const winners=getWinnersForLevel(level);if(!winners.length)return false;stopGame();markWinnerCards(winners);updateCompletedRowHighlights();$('winnerTop').textContent='BINGO! '+formatWinnerNames(winners);$('bingoSound').currentTime=0;$('bingoSound').play().catch(()=>{});if($('gameMode').value==='standard'||currentLevel===3){gameFinished=true;showAction('new-game','Starta nytt spel');}else{waitingForContinue=true;$('continueBtn').classList.remove('hidden');}updateStatus();return true;}
function showAction(action,label){$('actionBtn').dataset.action=action;$('actionBtn').textContent=label;$('actionBtn').classList.remove('hidden');}
function finishAdultRound(){stopGame();adultRoundEnded=true;adultRoundPrepared=false;waitingForContinue=false;$('continueBtn').classList.add('hidden');$('winnerTop').textContent='Rundan är slut. Ingen BINGO 3 innan 60 drag.';showAction('next-round','Nästa runda');updateStatus();}
function finishDrawPool(){stopGame();if(isAdultMode()){finishAdultRound();}else{gameFinished=true;$('winnerTop').textContent='Alla nummer är dragna.';showAction('new-game','Starta nytt spel');}updateRemainingCount();}
function drawNumber(){if(waitingForContinue||gameFinished||adultRoundEnded){stopGame();return;}if(!remaining.length){finishDrawPool();return;}const num=remaining.shift();drawn.push(num);const letter=getLetter(num);$('current-letter').textContent=letter;$('current-number').textContent=num;updateHistory();updateRemainingCount();if(!isPaperMode()){markCards(num);updateCompletedRowHighlights();}playDrawSound(letter,num);if(isAdultMode())checkAdultWin();else if(!isPaperMode())evaluateNormalWin();if(!remaining.length&&!waitingForContinue&&!gameFinished&&!adultRoundEnded)finishDrawPool();}
function beginTimer(ms){stopGame();if(!remaining.length){finishDrawPool();return;}intervalId=setInterval(drawNumber,ms);}
function startPaperGame(){if(intervalId!==null||waitingForContinue||gameFinished)return;if(!drawn.length){remaining=shuffle([...allNumbers]);$('cards').innerHTML='';$('winnerTop').textContent='';$('actionBtn').classList.add('hidden');}drawNumber();if(!gameFinished&&!waitingForContinue)beginTimer(Number($('paperSpeed').value));}
function startAdultGame(){if(intervalId!==null||waitingForContinue||gameFinished||adultRoundEnded)return;if(!adultRoundPrepared&&!prepareAdultRound())return;if(checkAdultWin())return;drawNumber();if(!waitingForContinue&&!gameFinished&&!adultRoundEnded)beginTimer(5000);}
function startNormalGame(){if(intervalId!==null||waitingForContinue||gameFinished)return;if(!drawn.length){remaining=shuffle([...allNumbers]);$('winnerTop').textContent='';$('actionBtn').classList.add('hidden');}drawNumber();if(!waitingForContinue&&!gameFinished)beginTimer(5000);}
function startGame(){musicPlay();if(isPaperMode())startPaperGame();else if(isAdultMode())startAdultGame();else startNormalGame();}
function continueAfterWin(){if(!waitingForContinue)return;waitingForContinue=false;clearWinnerCards();$('winnerTop').textContent='';$('continueBtn').classList.add('hidden');if(isPaperMode()){beginTimer(Number($('paperSpeed').value));return;}if(isAdultMode()){if(checkAdultWin())return;beginTimer(5000);updateStatus();return;}currentLevel++;updateStatus();if(evaluateNormalWin())return;beginTimer(5000);}
function paperBingoPause(){if(!isPaperMode()||!drawn.length||gameFinished||waitingForContinue)return;stopGame();waitingForContinue=true;$('winnerTop').textContent='BINGO! Kontrollera brickan.';$('continueBtn').classList.remove('hidden');$('bingoSound').currentTime=0;$('bingoSound').play().catch(()=>{});}
function updateStatus(){if(isPaperMode())$('statusBar').textContent='Pappersbingo';else if(isAdultMode())$('statusBar').textContent=`Bingo 3 nivå VUXEN – Runda ${adultSession.round}`;else if($('gameMode').value==='three-level')$('statusBar').textContent=`Bingo 3 nivåer – Bingo ${currentLevel}`;else $('statusBar').textContent='Standard Bingo';}
function refreshModeUI(){const adult=isAdultMode(),paper=isPaperMode();$('normalSettings').classList.toggle('hidden',adult||paper);$('adultSettingsTop').classList.toggle('hidden',!adult);$('adultConfigWrap').classList.toggle('hidden',!adult);$('adultPotsWrap').classList.toggle('hidden',!adult);$('adultStatsWrap').classList.toggle('hidden',!adult);$('paperSettings').classList.toggle('hidden',!paper);updateStatus();}
function resetGame(){stopGame();remaining=[];drawn=[];currentLevel=1;waitingForContinue=false;gameFinished=false;adultRoundEnded=false;adultRoundPrepared=false;$('current-letter').textContent='-';$('current-number').textContent='';$('winnerTop').textContent='';$('history').textContent='';$('continueBtn').classList.add('hidden');$('actionBtn').classList.add('hidden');$('actionBtn').dataset.action='';if(isPaperMode())$('cards').innerHTML='';else if(isAdultMode()){resetAdultSession();renderAdultCardsPreview();}else renderNormalCards(Number($('playerCount').value));updateRemainingCount();updateStatus();$('bgm').pause();$('bgm').currentTime=0;}
function nextAdultRound(){adultSession.round++;stopGame();drawn=[];remaining=[];adultRoundEnded=false;adultRoundPrepared=false;waitingForContinue=false;gameFinished=false;adultRoundPaid={1:false,2:false,3:false};$('winnerTop').textContent='';$('current-letter').textContent='-';$('current-number').textContent='';$('history').textContent='';$('actionBtn').classList.add('hidden');$('continueBtn').classList.add('hidden');updateRemainingCount();updateStatus();}
$('gameMode').addEventListener('change',()=>{refreshModeUI();resetGame();});$('playerCount').addEventListener('change',()=>{if(!isAdultMode()&&!isPaperMode())resetGame();});$('startBtn').addEventListener('click',startGame);$('continueBtn').addEventListener('click',continueAfterWin);$('bingoBtn').addEventListener('click',()=>{if(isPaperMode())paperBingoPause();else{$('bingoSound').currentTime=0;$('bingoSound').play().catch(()=>{});}});$('toggleSpeakBtn').addEventListener('click',()=>{speakEnabled=!speakEnabled;$('toggleSpeakBtn').textContent='Tal: '+(speakEnabled?'På':'Av');});$('resetBtn').addEventListener('click',resetGame);$('actionBtn').addEventListener('click',()=>{if($('actionBtn').dataset.action==='next-round'){nextAdultRound();}else{resetGame();startGame();}});$('paperSpeed').addEventListener('change',()=>{if(isPaperMode()&&intervalId!==null)beginTimer(Number($('paperSpeed').value));});$('moneyEnabled').addEventListener('change',()=>{if(isAdultMode()&&!adultRoundPrepared&&!drawn.length){adultSession.moneyEnabled=$('moneyEnabled').checked;renderAdultPots();}});
for(let i=0;i<=10;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=i;if(i===2)opt.selected=true;$('playerCount').appendChild(opt);}createAdultPlayerConfig();loadMusic();$('volumeLabel').textContent=$('musicVolume').value+' %';refreshModeUI();resetGame();
</script>
</body>
</html>
