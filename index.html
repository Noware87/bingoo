<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico & Neo Bingo</title>

<style>
:root {
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --border: #dbe3ef;
  --background: #f2f5fa;
  --text: #17243b;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
  margin: 0;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin: 8px 0 22px;
  text-align: center;
  font-size: clamp(32px, 5vw, 58px);
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1.15;
  background: linear-gradient(110deg, #1756c8, #7c3aed, #2563eb);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 2px rgba(30, 64, 175, 0.16));
}

.settings-panel,
.music-panel {
  width: 100%;
  max-width: 1250px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 14px;
  margin-bottom: 13px;
}

.settings-row,
.music-row,
.action-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

.action-row {
  width: 100%;
  max-width: 1250px;
  margin-bottom: 15px;
}

label,
select,
input,
button {
  font-size: 16px;
}

select {
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  background: white;
  color: var(--text);
  padding: 9px 11px;
  min-height: 43px;
}

button,
.action-link {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 10px 15px;
  border: 1px solid var(--blue);
  border-radius: 8px;
  background: var(--blue);
  color: white;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}

button:hover:not(:disabled),
.action-link:hover {
  background: var(--blue-dark);
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

button:focus-visible,
select:focus-visible,
a:focus-visible {
  outline: 3px solid #93c5fd;
  outline-offset: 2px;
}

.music-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.music-row {
  gap: 12px;
}

.music-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.music-buttons button {
  min-width: 47px;
  font-size: 21px;
  padding: 7px 11px;
}

.music-buttons button.active {
  background: #143b89;
  border-color: #143b89;
  box-shadow: inset 0 0 0 2px #93c5fd;
}

#musicVolume {
  width: 145px;
  accent-color: var(--blue);
}

#musicStatus {
  text-align: center;
  font-size: 13px;
  color: #64748b;
  min-height: 17px;
}

#statusBar {
  font-size: 19px;
  font-weight: 800;
  text-align: center;
  margin: 9px 0;
}

#currentArea {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin: 10px 0 18px;
}

#current {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  min-height: 100px;
}

#current-letter {
  font-size: 86px;
  font-weight: 900;
  color: #dc2626;
  line-height: 1;
}

#current-number {
  font-size: 62px;
  font-weight: 900;
  line-height: 1;
}

#remainingCount {
  font-size: 18px;
  font-weight: bold;
  min-height: 22px;
}

#winnerTop {
  font-size: 24px;
  font-weight: 800;
  color: #dc2626;
  text-align: center;
  max-width: 1100px;
  min-height: 30px;
}

#currentButtons {
  display: flex;
  justify-content: center;
  gap: 10px;
}

#continueBtn,
#actionBtn {
  display: none;
}

.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
}

.panel h3 {
  margin: 0 0 12px;
}

#adultConfigWrap,
#adultPotsWrap,
#adultStatsWrap {
  width: 100%;
  max-width: 1250px;
  margin-bottom: 15px;
}

#adultPlayersConfig {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px;
}

.adult-player-config {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px;
  border-radius: 8px;
  background: #f1f5f9;
}

.adult-player-config label {
  font-weight: bold;
}

#adultPots {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px;
}

.pot-box {
  border-radius: 9px;
  padding: 13px;
  color: white;
  font-weight: bold;
}

.pot1 { background: #0891b2; }
.pot2 { background: #16a34a; }
.pot3 { background: #dc2626; }

.pot-box small {
  display: block;
  margin-top: 7px;
  font-weight: normal;
}

#cards {
  width: 100%;
  max-width: 1350px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.flat-card-wrap {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.adult-board {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
  gap: 12px;
}

.adult-player-column {
  background: white;
  border: 2px solid var(--border);
  border-radius: 11px;
  padding: 10px;
}

.adult-player-title {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 10px;
}

.adult-player-cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
}

.bingo-card {
  background: white;
  border: 2px solid var(--blue);
  border-radius: 8px;
  padding: 5px;
}

.bingo-card.winner-card {
  background: #ff4d4d;
  border-color: #b91c1c;
  box-shadow: 0 0 15px rgba(185, 28, 28, 0.35);
}

.card-title {
  text-align: center;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
}

.bingo-card table {
  border-collapse: collapse;
}

.bingo-card th,
.bingo-card td {
  border: 1px solid #cbd5e1;
  width: 28px;
  height: 28px;
  text-align: center;
  vertical-align: middle;
  padding: 1px;
  font-size: 12px;
}

.bingo-card th {
  background: var(--blue);
  color: white;
}

.bingo-card td.marked {
  background: #fde047;
}

.bingo-card td.completed {
  background: #22c55e;
  font-weight: bold;
}

#history {
  max-width: 1250px;
  margin-top: 8px;
  text-align: center;
  font-size: 17px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.stats-scroll {
  overflow-x: auto;
}

.stats-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

.stats-table th,
.stats-table td {
  border: 1px solid #dbe3ef;
  padding: 8px;
  text-align: center;
  font-size: 14px;
}

.stats-table th {
  background: #f1f5f9;
}

.hidden {
  display: none !important;
}

@media (max-width: 700px) {
  body {
    padding: 10px;
  }

  h1 {
    letter-spacing: -0.5px;
  }

  .action-row {
    gap: 7px;
  }

  .action-row button,
  .action-row .action-link {
    font-size: 13px;
    padding: 9px 10px;
  }

  #current-letter {
    font-size: 60px;
  }

  #current-number {
    font-size: 45px;
  }

  #winnerTop {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<h1>Nico &amp; Neo Bingo</h1>

<div class="settings-panel">
  <div class="settings-row">

    <label for="gameMode">Spelläge:</label>

    <select id="gameMode">
      <option value="standard">Standard Bingo</option>
      <option value="three-level">Bingo 3 nivåer</option>
      <option value="adult">Bingo 3 nivå VUXEN</option>
      <option value="paper">Pappersbingo</option>
    </select>

    <div id="normalSettings">
      <label for="playerCount">Brickor:</label>
      <select id="playerCount">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>

    <div id="adultSettingsTop" class="hidden">
      <label>
        <input type="checkbox" id="moneyEnabled">
        Spela med pengar
      </label>
    </div>

    <div id="paperSettings" class="hidden">
      <label for="paperSpeed">Tid mellan nummer:</label>
      <select id="paperSpeed">
        <option value="3000">3 sek</option>
        <option value="5000" selected>5 sek</option>
        <option value="7000">7 sek</option>
        <option value="10000">10 sek</option>
        <option value="15000">15 sek</option>
        <option value="20000">20 sek</option>
        <option value="30000">30 sek</option>
      </select>
    </div>

  </div>
</div>

<div class="action-row">

  <button id="startBtn" type="button">▶️ Starta</button>

  <button id="resetBtn" type="button">⏹️ Stoppa/Återställ</button>

  <button id="toggleSpeakBtn" type="button">🔊 Tal: Av</button>

  <a
    id="printBtn"
    class="action-link"
    href="bingo.pdf"
    target="_blank"
    rel="noopener noreferrer"
  >🖨️ Skriv ut bingobrickor</a>

  <button id="bingoBtn" type="button">🎉 BINGO</button>

</div>

<div class="music-panel">

  <div class="music-row">

    <label for="musicSelect">🎵 Musik:</label>

    <select id="musicSelect">
      <option value="off">Musik av</option>
      <option value="background.mp3" selected>Original</option>
      <option value="background1.mp3">Bakgrund 1</option>
      <option value="background2.mp3">Bakgrund 2</option>
      <option value="background3.mp3">Bakgrund 3</option>
      <option value="halloween.mp3">Halloween</option>
      <option value="jazz.mp3">Jazz</option>
      <option value="jazz1.mp3">Jazz 1</option>
      <option value="jazz2.mp3">Jazz 2</option>
    </select>

    <div class="music-buttons">
      <button id="prevMusicBtn" type="button" title="Föregående låt" aria-label="Föregående låt">⏮️</button>
      <button id="playPauseMusicBtn" type="button" title="Pausa eller spela" aria-label="Pausa eller spela">▶️</button>
      <button id="nextMusicBtn" type="button" title="Nästa låt" aria-label="Nästa låt">⏭️</button>
      <button id="repeatMusicBtn" type="button" title="Upprepa samma låt" aria-label="Upprepa samma låt">🔁</button>
    </div>

    <label for="musicVolume">Volym:</label>

    <input
      type="range"
      id="musicVolume"
      min="0"
      max="100"
      value="30"
    >

    <span id="volumeValue">30%</span>

  </div>

  <div id="musicStatus" aria-live="polite"></div>

</div>

<div id="statusBar"></div>

<div id="currentArea">

  <div id="current">
    <div id="current-letter">-</div>
    <div id="current-number"></div>
  </div>

  <div id="remainingCount"></div>
  <div id="winnerTop"></div>

  <div id="currentButtons">
    <button id="continueBtn" type="button">Fortsätt</button>
    <button id="actionBtn" type="button">Starta nytt spel</button>
  </div>

</div>

<div id="adultConfigWrap" class="hidden">
  <div class="panel">
    <h3>Vuxenläge – välj brickor per spelare</h3>
    <div id="adultPlayersConfig"></div>
  </div>
</div>

<div id="adultPotsWrap" class="hidden">
  <div class="panel">
    <h3>Pottar</h3>
    <div id="adultPots"></div>
  </div>
</div>

<div id="cards"></div>

<div id="adultStatsWrap" class="hidden">
  <div class="panel">
    <h3>Statistik</h3>
    <div class="stats-scroll" id="adultStats"></div>
  </div>
</div>

<div id="history"></div>

<audio id="bgm" preload="auto"></audio>
<audio id="ding" src="audio/ding.mp3"></audio>
<audio id="bingoSound" src="audio/bingo.mp3"></audio>

<script>
"use strict";

/* =====================================================
   GRUNDINSTÄLLNINGAR
===================================================== */

const ranges = {
  B: [1, 15],
  I: [16, 30],
  N: [31, 45],
  G: [46, 60],
  O: [61, 75]
};

const allNumbers = Array.from(
  { length: 75 },
  (_, i) => i + 1
);

const $ = id => document.getElementById(id);

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getLetter(number) {
  if (number <= 15) return "B";
  if (number <= 30) return "I";
  if (number <= 45) return "N";
  if (number <= 60) return "G";
  return "O";
}

function isAdultMode() {
  return $("gameMode").value === "adult";
}

function isPaperMode() {
  return $("gameMode").value === "paper";
}

function isThreeLevelMode() {
  return $("gameMode").value === "three-level";
}

/* =====================================================
   MUSIKSPELARE
===================================================== */

const musicFiles = [
  "background.mp3",
  "background1.mp3",
  "background2.mp3",
  "background3.mp3",
  "halloween.mp3",
  "jazz.mp3",
  "jazz1.mp3",
  "jazz2.mp3"
];

const bgm = $("bgm");
const musicSelect = $("musicSelect");
const musicVolume = $("musicVolume");
const musicStatus = $("musicStatus");

let repeatSameSong = false;
let musicStarted = false;
let musicPausedByUser = false;

function saveMusicSettings() {
  try {
    localStorage.setItem("bingoMusic", musicSelect.value);
    localStorage.setItem("bingoMusicVolume", musicVolume.value);
    localStorage.setItem("bingoRepeatSong", repeatSameSong ? "1" : "0");
  } catch (error) {
    // Spelet fungerar även om lagring är blockerad.
  }
}

function loadMusicSettings() {
  try {
    const savedMusic = localStorage.getItem("bingoMusic");
    const savedVolume = localStorage.getItem("bingoMusicVolume");
    const savedRepeat = localStorage.getItem("bingoRepeatSong");

    if (savedMusic && musicFiles.includes(savedMusic)) {
      musicSelect.value = savedMusic;
    }

    if (savedMusic === "off") {
      musicSelect.value = "off";
    }

    if (savedVolume !== null) {
      const value = Number(savedVolume);
      if (Number.isFinite(value)) {
        musicVolume.value = Math.max(0, Math.min(100, value));
      }
    }

    repeatSameSong = savedRepeat === "1";
  } catch (error) {
    repeatSameSong = false;
  }

  updateMusicVolume();
  updateRepeatButton();
  loadSelectedMusic();
}

function updateMusicVolume() {
  bgm.volume = Number(musicVolume.value) / 100;
  $("volumeValue").textContent = musicVolume.value + "%";
}

function updateMusicStatus(message = "") {
  if (message) {
    musicStatus.textContent = message;
    return;
  }

  if (musicSelect.value === "off") {
    musicStatus.textContent = "Musiken är avstängd";
    return;
  }

  const selectedOption = musicSelect.selectedOptions[0];
  const songName = selectedOption
    ? selectedOption.textContent
    : "Okänd låt";

  if (bgm.paused) {
    musicStatus.textContent = "Pausad: " + songName;
  } else {
    musicStatus.textContent = "🎵 Spelar nu: " + songName;
  }
}

function updatePlayPauseButton() {
  const button = $("playPauseMusicBtn");

  if (musicSelect.value === "off" || bgm.paused) {
    button.textContent = "▶️";
    button.title = "Spela musik";
    button.setAttribute("aria-label", "Spela musik");
  } else {
    button.textContent = "⏸️";
    button.title = "Pausa musik";
    button.setAttribute("aria-label", "Pausa musik");
  }
}

function updateRepeatButton() {
  const button = $("repeatMusicBtn");

  button.classList.toggle("active", repeatSameSong);
  button.setAttribute("aria-pressed", repeatSameSong ? "true" : "false");

  button.title = repeatSameSong
    ? "Upprepa samma låt är på"
    : "Spela nästa låt är på";

  button.setAttribute(
    "aria-label",
    repeatSameSong
      ? "Upprepa samma låt är på"
      : "Spela nästa låt är på"
  );
}

function loadSelectedMusic() {
  bgm.pause();

  if (musicSelect.value === "off") {
    bgm.removeAttribute("src");
    bgm.load();
    updatePlayPauseButton();
    updateMusicStatus();
    return;
  }

  bgm.src = "audio/" + musicSelect.value;
  bgm.load();

  updatePlayPauseButton();
  updateMusicStatus();
}

async function playMusic() {
  if (musicSelect.value === "off") {
    updatePlayPauseButton();
    updateMusicStatus();
    return;
  }

  if (!bgm.getAttribute("src")) {
    loadSelectedMusic();
  }

  try {
    await bgm.play();

    musicStarted = true;
    musicPausedByUser = false;

    updatePlayPauseButton();
    updateMusicStatus();
  } catch (error) {
    updatePlayPauseButton();

    updateMusicStatus(
      "Tryck på ▶️ för att starta musiken om webbläsaren blockerar automatisk uppspelning."
    );
  }
}

function pauseMusic() {
  bgm.pause();
  musicPausedByUser = true;

  updatePlayPauseButton();
  updateMusicStatus();
}

function changeMusic(direction) {
  const currentIndex = musicFiles.indexOf(musicSelect.value);

  let nextIndex;

  if (currentIndex === -1) {
    nextIndex = direction < 0 ? musicFiles.length - 1 : 0;
  } else {
    nextIndex =
      (currentIndex + direction + musicFiles.length) %
      musicFiles.length;
  }

  musicSelect.value = musicFiles[nextIndex];

  loadSelectedMusic();
  saveMusicSettings();
  playMusic();
}

function handleMusicEnded() {
  if (musicSelect.value === "off") return;

  if (repeatSameSong) {
    bgm.currentTime = 0;
    playMusic();
  } else {
    changeMusic(1);
  }
}

function tryAutoplayMusic() {
  if (musicSelect.value === "off") return;
  if (musicPausedByUser) return;
  if (!bgm.paused) return;

  playMusic();
}

musicSelect.addEventListener("change", () => {
  musicPausedByUser = false;
  loadSelectedMusic();
  saveMusicSettings();
  playMusic();
});

musicVolume.addEventListener("input", () => {
  updateMusicVolume();
  saveMusicSettings();
});

$("prevMusicBtn").addEventListener("click", () => {
  changeMusic(-1);
});

$("nextMusicBtn").addEventListener("click", () => {
  changeMusic(1);
});

$("playPauseMusicBtn").addEventListener("click", () => {
  if (musicSelect.value === "off") {
    musicSelect.value = musicFiles[0];
    loadSelectedMusic();
    saveMusicSettings();
    playMusic();
    return;
  }

  if (bgm.paused) {
    playMusic();
  } else {
    pauseMusic();
  }
});

$("repeatMusicBtn").addEventListener("click", () => {
  repeatSameSong = !repeatSameSong;
  updateRepeatButton();
  saveMusicSettings();

  updateMusicStatus(
    repeatSameSong
      ? "🔁 Upprepa samma låt"
      : "⏭️ Spela nästa låt automatiskt"
  );
});

bgm.addEventListener("ended", handleMusicEnded);

bgm.addEventListener("play", () => {
  updatePlayPauseButton();
  updateMusicStatus();
});

bgm.addEventListener("pause", () => {
  updatePlayPauseButton();
  updateMusicStatus();
});

bgm.addEventListener("error", () => {
  updateMusicStatus(
    "Kunde inte spela musikfilen. Kontrollera filnamnet i audio-mappen."
  );
});

/*
  Webbläsare tillåter inte alltid automatisk
  musik med ljud. Därför försöker vi vid
  sidladdning och sedan vid första interaktion.
*/

document.addEventListener("pointerdown", tryAutoplayMusic, {
  once: true
});

document.addEventListener("keydown", tryAutoplayMusic, {
  once: true
});

/* =====================================================
   BINGO – SPELVARIABLER
===================================================== */

let remaining = [];
let drawn = [];
let intervalId = null;

let speakEnabled = false;
let currentLevel = 1;
let waitingForContinue = false;
let gameFinished = false;
let gameStarted = false;

let adultHiddenRemoved = [];
let adultRoundEnded = false;
let adultRoundPrepared = false;
let adultRoundPaid = {
  1: false,
  2: false,
  3: false
};

const adultSession = {
  round: 1,
  moneyEnabled: false,
  pots: {
    1: 0,
    2: 0,
    3: 0
  },
  stats: Array.from({ length: 10 }, () => ({
    bought: 0,
    spent: 0,
    wins1: 0,
    wins2: 0,
    wins3: 0,
    won: 0
  }))
};

/* =====================================================
   LJUD FÖR BINGO
===================================================== */

const ding = $("ding");
const bingoSound = $("bingoSound");

let activeSpeech = null;
let speechSequence = 0;

function stopSpeech() {
  speechSequence++;

  if (activeSpeech) {
    activeSpeech.pause();
    activeSpeech = null;
  }
}

function playSound(audioElement) {
  try {
    audioElement.currentTime = 0;
    audioElement.play().catch(() => {});
  } catch (error) {}
}

function playDrawSound(letter, number) {
  stopSpeech();

  if (!speakEnabled) {
    playSound(ding);
    return;
  }

  const sequence = speechSequence;

  const letterAudio = new Audio("audio/" + letter + ".mp3");
  activeSpeech = letterAudio;

  letterAudio.addEventListener("ended", () => {
    if (sequence !== speechSequence) return;

    const numberAudio = new Audio("audio/" + number + ".mp3");
    activeSpeech = numberAudio;

    numberAudio.play().catch(() => {});
  }, { once: true });

  letterAudio.play().catch(() => {});
}

/* =====================================================
   BINGOBRICKOR
===================================================== */

function buildCardData(rowCount) {
  const columns = {};

  Object.entries(ranges).forEach(([letter, limits]) => {
    const numbers = [];

    for (let n = limits[0]; n <= limits[1]; n++) {
      numbers.push(n);
    }

    shuffle(numbers);
    columns[letter] = numbers.slice(0, rowCount);
  });

  const rows = [];

  for (let row = 0; row < rowCount; row++) {
    rows.push([
      columns.B[row],
      columns.I[row],
      columns.N[row],
      columns.G[row],
      columns.O[row]
    ]);
  }

  return rows;
}

function createCardElement({
  title,
  rows,
  playerIndex = null,
  playerCardIndex = null,
  flatIndex = null
}) {
  const card = document.createElement("div");
  card.className = "bingo-card";

  if (playerIndex !== null) {
    card.dataset.playerIndex = playerIndex;
  }

  if (playerCardIndex !== null) {
    card.dataset.playerCardIndex = playerCardIndex;
  }

  if (flatIndex !== null) {
    card.dataset.flatIndex = flatIndex;
  }

  const titleElement = document.createElement("div");
  titleElement.className = "card-title";
  titleElement.textContent = title;
  card.appendChild(titleElement);

  const table = document.createElement("table");
  const heading = document.createElement("tr");

  ["B", "I", "N", "G", "O"].forEach(letter => {
    const th = document.createElement("th");
    th.textContent = letter;
    heading.appendChild(th);
  });

  table.appendChild(heading);

  rows.forEach(row => {
    const tr = document.createElement("tr");

    row.forEach(number => {
      const td = document.createElement("td");
      td.textContent = number;
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });

  card.appendChild(table);
  return card;
}

function renderNormalCards(count) {
  $("cards").innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "flat-card-wrap";

  for (let i = 0; i < count; i++) {
    wrapper.appendChild(createCardElement({
      title: "Bricka " + (i + 1),
      rows: buildCardData(15),
      flatIndex: i
    }));
  }

  $("cards").appendChild(wrapper);
}

function createAdultPlayerConfig() {
  const container = $("adultPlayersConfig");
  container.innerHTML = "";

  for (let i = 1; i <= 10; i++) {
    const row = document.createElement("div");
    row.className = "adult-player-config";

    const label = document.createElement("label");
    label.textContent = "SPELARE " + i;

    const select = document.createElement("select");

    for (let n = 0; n <= 5; n++) {
      const option = document.createElement("option");

      option.value = n;
      option.textContent = n + " brickor";

      if (i <= 2 && n === 1) {
        option.selected = true;
      }

      select.appendChild(option);
    }

    select.addEventListener("change", () => {
      if (
        !adultRoundPrepared &&
        !gameStarted &&
        !waitingForContinue
      ) {
        renderAdultCardsPreview();
      }
    });

    row.appendChild(label);
    row.appendChild(select);
    container.appendChild(row);
  }
}

function getAdultSelections() {
  return Array.from(
    $("adultPlayersConfig").querySelectorAll("select")
  ).map(select => Number(select.value));
}

function renderAdultCardsPreview() {
  const container = $("cards");
  container.innerHTML = "";

  const selections = getAdultSelections();

  const board = document.createElement("div");
  board.className = "adult-board";

  selections.forEach((count, playerIndex) => {
    if (count === 0) return;

    const column = document.createElement("div");
    column.className = "adult-player-column";

    const title = document.createElement("div");
    title.className = "adult-player-title";
    title.textContent = "SPELARE " + (playerIndex + 1);

    column.appendChild(title);

    const cardHolder = document.createElement("div");
    cardHolder.className = "adult-player-cards";

    for (let i = 0; i < count; i++) {
      cardHolder.appendChild(createCardElement({
        title: "Bricka " + (i + 1),
        rows: buildCardData(3),
        playerIndex,
        playerCardIndex: i
      }));
    }

    column.appendChild(cardHolder);
    board.appendChild(column);
  });

  container.appendChild(board);
}

/* =====================================================
   MARKERING OCH VINSTKONTROLL
===================================================== */

function markCards(number) {
  $("cards").querySelectorAll("td").forEach(cell => {
    if (Number(cell.textContent) === number) {
      cell.classList.add("marked");
    }
  });
}

function updateCompletedRowHighlights() {
  $("cards").querySelectorAll(".bingo-card").forEach(card => {
    const rows = Array.from(
      card.querySelectorAll("tr")
    ).slice(1);

    rows.forEach(row => {
      const cells = Array.from(row.querySelectorAll("td"));

      const completed =
        cells.length > 0 &&
        cells.every(cell => cell.classList.contains("marked"));

      cells.forEach(cell => {
        cell.classList.toggle("completed", completed);
      });
    });
  });
}

function getCompletedRowsForCard(card) {
  const rows = Array.from(
    card.querySelectorAll("tr")
  ).slice(1);

  return rows.filter(row => {
    const cells = Array.from(row.querySelectorAll("td"));

    return (
      cells.length > 0 &&
      cells.every(cell => cell.classList.contains("marked"))
    );
  }).length;
}

function getWinnersForLevel(level) {
  const winners = [];

  $("cards").querySelectorAll(".bingo-card").forEach(card => {
    if (getCompletedRowsForCard(card) >= level) {
      winners.push({
        cardEl: card,

        playerIndex:
          card.dataset.playerIndex !== undefined
            ? Number(card.dataset.playerIndex)
            : null,

        playerCardIndex:
          card.dataset.playerCardIndex !== undefined
            ? Number(card.dataset.playerCardIndex)
            : null,

        flatIndex:
          card.dataset.flatIndex !== undefined
            ? Number(card.dataset.flatIndex)
            : null
      });
    }
  });

  return winners;
}

function formatWinnerNames(winners) {
  return winners.map(winner => {
    if (isAdultMode()) {
      return (
        "Spelare " + (winner.playerIndex + 1) +
        " - Bricka " + (winner.playerCardIndex + 1)
      );
    }

    return "Bricka " + (winner.flatIndex + 1);
  }).join(", ");
}

function clearWinnerCards() {
  $("cards").querySelectorAll(".winner-card").forEach(card => {
    card.classList.remove("winner-card");
  });
}

function markWinnerCards(winners) {
  clearWinnerCards();

  winners.forEach(winner => {
    winner.cardEl.classList.add("winner-card");
  });
}

/* =====================================================
   HISTORIK OCH STATUS
===================================================== */

function updateHistory() {
  if (!drawn.length) {
    $("history").textContent = "";
    return;
  }

  $("history").textContent =
    "Dragna nummer: " +
    drawn.map(number => {
      return getLetter(number) + number;
    }).join(" - ");
}

function updateRemainingCount() {
  if (isAdultMode() || isPaperMode()) {
    $("remainingCount").textContent =
      "Kvar att dra: " + remaining.length;
  } else {
    $("remainingCount").textContent = "";
  }
}

function updateStatus() {
  if (isPaperMode()) {
    $("statusBar").textContent = "Pappersbingo";
  } else if (isAdultMode()) {
    $("statusBar").textContent =
      "Bingo 3 nivå VUXEN – Runda " + adultSession.round;
  } else if (isThreeLevelMode()) {
    $("statusBar").textContent =
      "Bingo 3 nivåer – Bingo " + currentLevel;
  } else {
    $("statusBar").textContent = "Standard Bingo";
  }
}

function stopGame() {
  if (intervalId !== null) {
    clearInterval(intervalId);
    intervalId = null;
  }
}

/* =====================================================
   VUXENBINGO – POTTAR OCH STATISTIK
===================================================== */

function renderAdultPots() {
  const container = $("adultPots");
  container.innerHTML = "";

  [1, 2, 3].forEach(level => {
    const box = document.createElement("div");
    box.className = "pot-box pot" + level;

    const value = adultSession.moneyEnabled
      ? adultSession.pots[level] + " kr"
      : "Avstängt";

    box.innerHTML =
      "Pot " + level + ": " + value +
      "<small>" +
      (adultRoundPaid[level]
        ? "Utbetald denna runda"
        : "Öppen") +
      "</small>";

    container.appendChild(box);
  });
}

function renderAdultStats() {
  const rows = adultSession.stats.map((stat, index) => {
    return `
      <tr>
        <td>Spelare ${index + 1}</td>
        <td>${stat.bought}</td>
        <td>${stat.spent} kr</td>
        <td>${stat.wins1}</td>
        <td>${stat.wins2}</td>
        <td>${stat.wins3}</td>
        <td>${stat.won} kr</td>
      </tr>
    `;
  }).join("");

  $("adultStats").innerHTML = `
    <table class="stats-table">
      <thead>
        <tr>
          <th>Spelare</th>
          <th>Köpta brickor</th>
          <th>Satsat</th>
          <th>Pot 1</th>
          <th>Pot 2</th>
          <th>Pot 3</th>
          <th>Vunnit</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function distributeRoundMoney(totalMoney) {
  if (!adultSession.moneyEnabled || totalMoney <= 0) return;

  const pot1 = Math.floor(totalMoney * 0.20);
  const pot2 = Math.floor(totalMoney * 0.30);
  const pot3 = totalMoney - pot1 - pot2;

  adultSession.pots[1] += pot1;
  adultSession.pots[2] += pot2;
  adultSession.pots[3] += pot3;
}

function prepareAdultRound() {
  const selections = getAdultSelections();
  const totalCards = selections.reduce(
    (sum, count) => sum + count,
    0
  );

  if (!totalCards) {
    $("winnerTop").textContent = "Välj minst en bricka.";
    return false;
  }

  drawn = [];
  adultRoundPaid = {
    1: false,
    2: false,
    3: false
  };

  adultSession.moneyEnabled = $("moneyEnabled").checked;

  selections.forEach((count, index) => {
    adultSession.stats[index].bought += count;

    if (adultSession.moneyEnabled) {
      adultSession.stats[index].spent += count * 2;
    }
  });

  distributeRoundMoney(
    adultSession.moneyEnabled ? totalCards * 2 : 0
  );

  /*
    Exakt 15 nummer tas bort i hemlighet.
    75 - 15 = 60 dragbara nummer.
  */

  const shuffledNumbers = shuffle([...allNumbers]);

  adultHiddenRemoved = shuffledNumbers.slice(0, 15);

  const hiddenSet = new Set(adultHiddenRemoved);

  remaining = shuffle(
    allNumbers.filter(number => !hiddenSet.has(number))
  );

  renderAdultCardsPreview();
  renderAdultPots();
  renderAdultStats();
  updateRemainingCount();

  adultRoundPrepared = true;

  return true;
}

function nextAdultLevel() {
  if (!adultRoundPaid[1]) return 1;
  if (!adultRoundPaid[2]) return 2;
  if (!adultRoundPaid[3]) return 3;
  return null;
}

function handleAdultWin(level, winners) {
  stopGame();

  adultRoundPaid[level] = true;
  waitingForContinue = level < 3;

  markWinnerCards(winners);
  updateCompletedRowHighlights();

  let payoutText = "";

  if (adultSession.moneyEnabled) {
    const pot = adultSession.pots[level];

    const share = Math.floor(pot / winners.length);
    const remainder = pot - share * winners.length;

    const payouts = {};

    winners.forEach(winner => {
      const player = winner.playerIndex;

      payouts[player] = (payouts[player] || 0) + share;

      const stat = adultSession.stats[player];

      stat.won += share;

      if (level === 1) stat.wins1++;
      if (level === 2) stat.wins2++;
      if (level === 3) stat.wins3++;
    });

    adultSession.pots[level] = 0;

    if (level === 1) {
      adultSession.pots[2] += remainder;
    } else {
      adultSession.pots[3] += remainder;
    }

    payoutText =
      " | " +
      Object.entries(payouts).map(([player, amount]) => {
        return (
          "Spelare " + (Number(player) + 1) +
          ": " + amount + " kr"
        );
      }).join(" | ");
  } else {
    winners.forEach(winner => {
      const stat = adultSession.stats[winner.playerIndex];

      if (level === 1) stat.wins1++;
      if (level === 2) stat.wins2++;
      if (level === 3) stat.wins3++;
    });
  }

  $("winnerTop").textContent =
    "BINGO! " +
    formatWinnerNames(winners) +
    payoutText;

  playSound(bingoSound);

  renderAdultPots();
  renderAdultStats();

  if (level === 3) {
    gameFinished = true;

    $("continueBtn").style.display = "none";
    $("actionBtn").style.display = "inline-flex";
    $("actionBtn").textContent = "Starta nytt spel";
    $("actionBtn").dataset.action = "new-game";
  } else {
    $("continueBtn").style.display = "inline-flex";
  }

  updateStatus();
}

function checkAdultWin() {
  const level = nextAdultLevel();

  if (level === null) return false;

  const winners = getWinnersForLevel(level);

  if (winners.length) {
    handleAdultWin(level, winners);
    return true;
  }

  return false;
}

/* =====================================================
   STANDARD OCH 3 NIVÅER
===================================================== */

function evaluateNormalWin() {
  const level = isThreeLevelMode() ? currentLevel : 1;
  const winners = getWinnersForLevel(level);

  if (!winners.length) return false;

  stopGame();

  markWinnerCards(winners);
  updateCompletedRowHighlights();

  $("winnerTop").textContent =
    "BINGO! " + formatWinnerNames(winners);

  playSound(bingoSound);

  if (!isThreeLevelMode() || currentLevel === 3) {
    gameFinished = true;

    $("actionBtn").style.display = "inline-flex";
    $("actionBtn").textContent = "Starta nytt spel";
    $("actionBtn").dataset.action = "new-game";
  } else {
    waitingForContinue = true;
    $("continueBtn").style.display = "inline-flex";
  }

  updateStatus();
  return true;
}

/* =====================================================
   DRAGNING AV NUMMER
===================================================== */

function finishRound() {
  stopGame();

  if (isAdultMode()) {
    adultRoundEnded = true;
    adultRoundPrepared = false;

    $("winnerTop").textContent =
      "Rundan är slut. Ingen Bingo 3 efter 60 drag.";

    $("actionBtn").style.display = "inline-flex";
    $("actionBtn").textContent = "Nästa runda";
    $("actionBtn").dataset.action = "next-round";
  } else {
    gameFinished = true;

    $("winnerTop").textContent = "Alla nummer är dragna.";

    $("actionBtn").style.display = "inline-flex";
    $("actionBtn").textContent = "Starta nytt spel";
    $("actionBtn").dataset.action = "new-game";
  }

  updateStatus();
}

function drawNumber() {
  if (
    waitingForContinue ||
    gameFinished ||
    adultRoundEnded
  ) {
    return;
  }

  if (!remaining.length) {
    finishRound();
    return;
  }

  const number = remaining.shift();
  const letter = getLetter(number);

  drawn.push(number);

  $("current-letter").textContent = letter;
  $("current-number").textContent = number;

  updateHistory();
  updateRemainingCount();

  if (!isPaperMode()) {
    markCards(number);
    updateCompletedRowHighlights();
  }

  playDrawSound(letter, number);

  if (isAdultMode()) {
    checkAdultWin();
  } else if (!isPaperMode()) {
    evaluateNormalWin();
  }

  if (
    remaining.length === 0 &&
    !waitingForContinue &&
    !gameFinished &&
    !adultRoundEnded
  ) {
    finishRound();
  }
}

/* =====================================================
   START AV SPELLÄGEN
===================================================== */

function startPaperGame() {
  if (
    intervalId !== null ||
    waitingForContinue ||
    gameFinished
  ) {
    return;
  }

  if (!gameStarted) {
    remaining = shuffle([...allNumbers]);
    drawn = [];

    $("cards").innerHTML = "";
    $("winnerTop").textContent = "";

    gameStarted = true;
  }

  drawNumber();

  if (!gameFinished && !waitingForContinue) {
    intervalId = setInterval(
      drawNumber,
      Number($("paperSpeed").value)
    );
  }
}

function startAdultGame() {
  if (
    intervalId !== null ||
    waitingForContinue ||
    gameFinished ||
    adultRoundEnded
  ) {
    return;
  }

  if (!adultRoundPrepared) {
    if (!prepareAdultRound()) return;
  }

  gameStarted = true;

  drawNumber();

  if (
    !waitingForContinue &&
    !gameFinished &&
    !adultRoundEnded
  ) {
    intervalId = setInterval(drawNumber, 5000);
  }
}

function startNormalGame() {
  if (
    intervalId !== null ||
    waitingForContinue ||
    gameFinished
  ) {
    return;
  }

  if (!gameStarted) {
    remaining = shuffle([...allNumbers]);
    drawn = [];
    gameStarted = true;
  }

  drawNumber();

  if (!waitingForContinue && !gameFinished) {
    intervalId = setInterval(drawNumber, 5000);
  }
}

function startGame() {
  if (isPaperMode()) {
    startPaperGame();
  } else if (isAdultMode()) {
    startAdultGame();
  } else {
    startNormalGame();
  }
}

/* =====================================================
   FORTSÄTT EFTER BINGO
===================================================== */

function continueAfterWin() {
  if (!waitingForContinue) return;

  waitingForContinue = false;

  clearWinnerCards();

  $("winnerTop").textContent = "";
  $("continueBtn").style.display = "none";

  if (isPaperMode()) {
    if (!remaining.length) {
      finishRound();
      return;
    }

    intervalId = setInterval(
      drawNumber,
      Number($("paperSpeed").value)
    );

    return;
  }

  if (isAdultMode()) {
    if (checkAdultWin()) return;

    if (!remaining.length) {
      finishRound();
      return;
    }

    intervalId = setInterval(drawNumber, 5000);
    return;
  }

  currentLevel++;
  updateStatus();

  if (getWinnersForLevel(currentLevel).length) {
    evaluateNormalWin();
    return;
  }

  if (!remaining.length) {
    finishRound();
    return;
  }

  intervalId = setInterval(drawNumber, 5000);
}

/* =====================================================
   PAPPERSBINGO – BINGOKNAPP
===================================================== */

function paperBingoPause() {
  if (
    !isPaperMode() ||
    !gameStarted ||
    !drawn.length ||
    waitingForContinue ||
    gameFinished
  ) {
    return;
  }

  stopGame();

  waitingForContinue = true;

  $("winnerTop").textContent =
    "BINGO! Kontrollera brickan.";

  $("continueBtn").style.display = "inline-flex";

  playSound(bingoSound);
}

/* =====================================================
   ÅTERSTÄLLNING
===================================================== */

function resetAdultSession() {
  adultSession.round = 1;
  adultSession.moneyEnabled = $("moneyEnabled").checked;

  adultSession.pots = {
    1: 0,
    2: 0,
    3: 0
  };

  adultSession.stats = Array.from(
    { length: 10 },
    () => ({
      bought: 0,
      spent: 0,
      wins1: 0,
      wins2: 0,
      wins3: 0,
      won: 0
    })
  );

  adultRoundPaid = {
    1: false,
    2: false,
    3: false
  };

  adultRoundPrepared = false;
  adultRoundEnded = false;

  renderAdultPots();
  renderAdultStats();
}

function resetGame() {
  stopGame();
  stopSpeech();

  /*
    Musiken stoppas INTE här.
    Den fortsätter oberoende av bingot.
  */

  remaining = [];
  drawn = [];

  currentLevel = 1;
  waitingForContinue = false;
  gameFinished = false;
  gameStarted = false;

  adultRoundEnded = false;
  adultRoundPrepared = false;

  $("current-letter").textContent = "-";
  $("current-number").textContent = "";

  $("winnerTop").textContent = "";
  $("remainingCount").textContent = "";
  $("history").textContent = "";

  $("continueBtn").style.display = "none";
  $("actionBtn").style.display = "none";

  $("cards").innerHTML = "";

  if (isAdultMode()) {
    resetAdultSession();
    renderAdultCardsPreview();
  } else if (!isPaperMode()) {
    renderNormalCards(Number($("playerCount").value));
  }

  updateRemainingCount();
  updateStatus();
}

function refreshModeUI() {
  const adult = isAdultMode();
  const paper = isPaperMode();

  $("normalSettings").classList.toggle(
    "hidden",
    adult || paper
  );

  $("adultSettingsTop").classList.toggle(
    "hidden",
    !adult
  );

  $("adultConfigWrap").classList.toggle(
    "hidden",
    !adult
  );

  $("adultPotsWrap").classList.toggle(
    "hidden",
    !adult
  );

  $("adultStatsWrap").classList.toggle(
    "hidden",
    !adult
  );

  $("paperSettings").classList.toggle(
    "hidden",
    !paper
  );

  updateStatus();
}

function nextAdultRound() {
  stopGame();
  stopSpeech();

  adultSession.round++;

  drawn = [];
  remaining = [];

  adultRoundEnded = false;
  adultRoundPrepared = false;
  waitingForContinue = false;
  gameFinished = false;
  gameStarted = false;

  adultRoundPaid = {
    1: false,
    2: false,
    3: false
  };

  $("current-letter").textContent = "-";
  $("current-number").textContent = "";

  $("winnerTop").textContent = "";
  $("history").textContent = "";

  $("actionBtn").style.display = "none";
  $("continueBtn").style.display = "none";

  renderAdultCardsPreview();
  updateRemainingCount();
  renderAdultPots();
  updateStatus();
}

/* =====================================================
   KNAPPAR OCH HÄNDELSER
===================================================== */

$("startBtn").addEventListener("click", startGame);

$("resetBtn").addEventListener("click", resetGame);

$("continueBtn").addEventListener(
  "click",
  continueAfterWin
);

$("toggleSpeakBtn").addEventListener("click", () => {
  speakEnabled = !speakEnabled;

  $("toggleSpeakBtn").textContent =
    "🔊 Tal: " + (speakEnabled ? "På" : "Av");
});

$("bingoBtn").addEventListener("click", () => {
  if (isPaperMode()) {
    paperBingoPause();
  } else {
    playSound(bingoSound);
  }
});

$("actionBtn").addEventListener("click", () => {
  if ($("actionBtn").dataset.action === "next-round") {
    nextAdultRound();
  } else {
    resetGame();
    startGame();
  }
});

$("gameMode").addEventListener("change", () => {
  refreshModeUI();
  resetGame();
});

$("playerCount").addEventListener("change", () => {
  if (!isAdultMode() && !isPaperMode()) {
    resetGame();
  }
});

$("paperSpeed").addEventListener("change", () => {
  if (isPaperMode() && intervalId !== null) {
    stopGame();

    intervalId = setInterval(
      drawNumber,
      Number($("paperSpeed").value)
    );
  }
});

$("moneyEnabled").addEventListener("change", () => {
  if (!adultRoundPrepared) {
    adultSession.moneyEnabled =
      $("moneyEnabled").checked;

    renderAdultPots();
  }
});

/* =====================================================
   STARTA HEMSIDAN
===================================================== */

function initialize() {
  createAdultPlayerConfig();

  loadMusicSettings();

  refreshModeUI();
  resetGame();

  /*
    Försök starta musiken direkt när
    besökaren öppnar hemsidan.
  */

  playMusic();
}

initialize();

</script>
